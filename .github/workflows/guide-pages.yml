name: Deploy IT-Inventory guide

on:
  push:
    branches: [main]
    paths:
      - 'it-inventory-site/**'
      - '.github/workflows/guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: guide-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload guide
        uses: actions/upload-pages-artifact@v3
        with:
          path: it-inventory-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
